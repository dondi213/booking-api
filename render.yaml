# Render Blueprint: creates the web service and the PostgreSQL database.
# In Render: New > Blueprint > select this repository.
services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Deploys are triggered by GitHub Actions only after tests pass (see .github/workflows/ci.yml).
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: booking-db
    plan: free
